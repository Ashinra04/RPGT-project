<!-----------------------------------------------------
     TELA DE INVENTARIO
------------------------------------------------------>
<div id="inventario-tela" class="oculto">
  <div id="inventario-body" class="">
    <div id="IRow1" class="">
      <div id="inventarioTITLE">INVENTARIO</div>
      <div id="Gears-box">
        <div id="SpriteIdlePlayer" class=""></div>
        
        <div id="SAmulet" class="Gslots" onclick="abrirModalGearsEquipados('amulet'); registarSlotGear('SAmulet')"></div>
        <div id="SWeapon" class="Gslots" onclick="abrirModalGearsEquipados('weapon'); registarSlotGear('SWeapon', 'weapon')"></div>
            
        <div id="SHelmet" class="Gslots" onclick="abrirModalGearsEquipados('helmet'); registarSlotGear('SHelmet', 'helmet')"></div>
        <div id="SArmor" class="Gslots" onclick="abrirModalGearsEquipados('armor'); registarSlotGear('SArmor', 'armor')"></div>
        <div id="SPants" class="Gslots" onclick="abrirModalGearsEquipados('pants'); registarSlotGear('SPants', 'pants')"></div>
            
        <div id="SRing" class="Gslots" onclick="abrirModalGearsEquipados('ring'); registarSlotGear('SRing')"></div>
        <div id="SShield" class="Gslots" onclick="abrirModalGearsEquipados('secondmao'); registarSlotGear('SShield', 'secondmao')"></div>
        <div id="SBoots" class="Gslots" onclick="abrirModalGearsEquipados('boots'); registarSlotGear('SBoots', 'boots')"></div>
      </div>
    </div>
        
    <div id="IRow2" class="">
      <div id="items-box" class="">
        <div id="CategoriaItems" class="">
          <div id="CAll" class="SlotCategory DFlexALCenter" onclick="criarInventario(); categoriaSelecionada('CAll')">ALL</div>
          
          <div id="CWeapons" class="SlotCategory DFlexALCenter imgContain" onclick="categoriaWeapon(); categoriaSelecionada('CWeapons')"></div>
          
          <div id="CArmors" class="SlotCategory DFlexALCenter imgContain" onclick="categoriaArmors(); categoriaSelecionada('CArmors')"></div>
          
          <div id="CKeys" class="SlotCategory DFlexALCenter imgContain" onclick="categoriaAcessorios(); categoriaSelecionada('CKeys')"></div>
          
          <div id="CPotions" class="SlotCategory DFlexALCenter imgContain" onclick="categoriaPotions(); categoriaSelecionada('CPotions')"></div>
        </div>
        
        <div id="ItemsSlots" class="">
          <div onclick="abrirModal()" class="SlotInven">
          </div>
        </div>
      </div>
    </div>
    
    <div id="fundo-overlay" class="oculto DFlexALCenter" onclick="fecharModal(event)">
      <div id="caixa-flutuante" class="">
        <div id="ItemTitleName"></div>
        
        <div id="ItemsDescricoesbox">
          <div id="primeiraRow">
            <div id="ItemImagemIcon"></div>
            <div id="ItemInfoBasicas"></div>
          </div>
          
          <div id="ItemInfoGerais"></div>
        </div>
        
        <div id="BotoesBOX">
          <button id="btnEQUIPAR" class="btnInventory" onclick="">EQUIPAR</button>
          <button id="btnDESEQUIPAR" class="btnInventory">DESEQUIPAR</button>
          <button id="btnCOMPARAR" class="btnInventory" onclick="">COMPARAR</button>
          <button id="btnFECHAR" class="btnInventory" onclick="document.getElementById('fundo-overlay').classList.add('oculto')">FECHAR</button>
        </div>
      </div>
    </div>
  </div>
      
  <div id="inventarioBTN">
    <div id="PerfiesC" class="BTNSglobais" onclick="mudarTela('perfilC-tela')"></div>
    <button class="BTNSglobais" onclick="mudarTela('torre-tela')">VOLTAR</button>
  </div>
</div>
<!----------------------------------------------------->
